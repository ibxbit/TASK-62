# =============================================================================
# nginx config for the TransitOps Yew SPA + /api/* reverse proxy.
#
# Routing:
#   /api/...             → proxy to api-test (strips the /api/ prefix)
#   /<static file>       → serve from disk with long cache for hashed assets
#   /<anything else>     → serve /index.html (SPA fallback — Yew router
#                          reads window.location and renders the correct page)
# =============================================================================

upstream transitops_api {
    server api-test:8081;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy ────────────────────────────────────────────────────────────
    # The trailing slash on the proxy_pass strips the /api/ prefix, so
    # /api/auth/login → http://api-test:8081/auth/login.
    location /api/ {
        proxy_pass         http://transitops_api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 30s;
    }

    # Cache-bust the SPA shell so browsers always see the latest WASM hash.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Long-cache hashed assets (Trunk emits content-hashed file names).
    location ~* \.(wasm|js|css|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — every non-asset, non-API path serves the Yew shell.
    location / {
        try_files $uri /index.html;
    }
}
